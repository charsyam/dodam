[package]
name = "dodam"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "59.0.0"
arrow-ord = "59.0.0"
arrow-row = "59.0.0"
arrow-select = "59.0.0"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
itoa = "1.0.15"
memchr = "2.8.2"
parquet = "59.0.0"
rayon = "1.12.0"
ryu = "1.0.20"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sqlparser = "0.62.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"], default-features = false }

[dev-dependencies]
arrow-cast = "59.0.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "olap"
harness = false

[[bench]]
name = "duckdb_e2e"
harness = false
